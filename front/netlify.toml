[build]
  # Export statique pour Netlify avec routes prérendues
  command = "node scripts/prerender-routes.mjs && npx nuxi generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.0"

#[functions]
#  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  targetPort = 3334
  port = 3333
